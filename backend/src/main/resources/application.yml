server:
  port: ${PORT:8082}

spring:
  application:
    name: portal
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campus_resell}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:campusResellSecretKeyMustBeVeryLongToMeetHmacShaRequirements32BytesLength}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  dev-mode: ${APP_DEV_MODE:true}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  cloudinary:
    url: ${CLOUDINARY_URL:}

spring.mail:
  host: ${SMTP_HOST:smtp.gmail.com}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
